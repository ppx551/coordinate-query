  <script>
    const input=document.querySelector('#nameInput');
    const suggestions=document.querySelector('#suggestions');
    const profile=document.querySelector('#profile');
    const message=document.querySelector('#message');
    const welcome=document.querySelector('#welcome');
    const toast=document.querySelector('#toast');
    let players=[];
    let toastTimer;

    function chunksFor(text){
      const coords=text.match(/\(\s*\d+\s*,\s*\d+\s*\)/g)||[];
      const chunks=[];let current='';
      for(const coord of coords){
        const next=current?`${current} ${coord}`:coord;
        if(next.length>=50){chunks.push(current);current=coord}else current=next;
      }
      if(current)chunks.push(current);
      return chunks;
    }

    function showSuggestions(){
      const query=input.value.trim().toLocaleLowerCase();
      suggestions.replaceChildren();
      if(!query){suggestions.hidden=true;return}
      const matches=players.filter(p=>p.name.toLocaleLowerCase().includes(query)).slice(0,8);
      for(const player of matches){
        const option=document.createElement('button');option.type='button';option.className='suggestion';option.setAttribute('role','option');
        option.innerHTML=`<span></span><small></small>`;option.querySelector('span').textContent=player.name;option.querySelector('small').textContent=player.city;
        option.addEventListener('click',()=>{input.value=player.name;suggestions.hidden=true;renderPlayer(player)});suggestions.append(option);
      }
      suggestions.hidden=matches.length===0;
    }

    function renderPlayer(player){
      message.textContent='';welcome.hidden=true;profile.hidden=false;
      const resources=Object.entries(player.resources).map(([label,value])=>({label,chunks:chunksFor(value)})).filter(item=>item.chunks.length);
      const total=resources.reduce((n,item)=>n+item.chunks.reduce((sum,c)=>sum+(c.match(/\(/g)||[]).length,0),0);
      profile.innerHTML=`<div class="profile-head"><div><div class="player-name"></div><div class="player-meta"><span class="meta-chip rank"></span><span class="meta-chip city"></span></div><div class="note"></div></div><div class="result-count"></div></div><div class="groups"></div>`;
      profile.querySelector('.player-name').textContent=player.name;
      profile.querySelector('.rank').textContent=`紅度 ${player.rank}`;
      profile.querySelector('.city').textContent=`主城 ${player.city}`;
      const note=profile.querySelector('.note');note.textContent=player.note;note.hidden=!player.note;
      profile.querySelector('.result-count').textContent=`${resources.length} 类 · ${total} 个坐标`;
      const groups=profile.querySelector('.groups');
      if(!resources.length){groups.innerHTML='<div class="empty">该角色暂无已分配坐标。</div>';return}
      resources.forEach(({label,chunks})=>{
        const card=document.createElement('section');card.className='resource';
        const head=document.createElement('div');head.className='resource-head';
        const title=document.createElement('div');title.className='resource-title';title.innerHTML=`<span class="resource-type"></span><span></span>`;title.querySelector('.resource-type').textContent=label.slice(0,2);title.querySelector('span:last-child').textContent=label.slice(2).trim()||'资源';
        const count=document.createElement('span');count.className='resource-total';count.textContent=`${chunks.reduce((n,c)=>n+(c.match(/\(/g)||[]).length,0)} 个 · ${chunks.length} 组`;
        head.append(title,count);card.append(head);
        const chunkList=document.createElement('div');chunkList.className='chunks';
        chunks.forEach((text,index)=>{
          const box=document.createElement('div');box.className='chunk';
          const content=document.createElement('div');content.className='chunk-text';content.textContent=text;
          const foot=document.createElement('div');foot.className='chunk-foot';
          const length=document.createElement('span');length.textContent=`${index+1}/${chunks.length} · ${text.length} 字`;
          const copy=document.createElement('button');copy.type='button';copy.className='copy';copy.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span>复制</span>';
          copy.addEventListener('click',()=>copyText(text));foot.append(length,copy);box.append(content,foot);chunkList.append(box);
        });
        card.append(chunkList);groups.append(card);
      });
    }

    async function copyText(text){
      try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();document.execCommand('copy');area.remove()}
      toast.textContent='坐标已复制';toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,1500);
    }

    function findPlayer(name){
      const query=name.trim().toLocaleLowerCase();
      if(!query){message.textContent='请输入角色名。';return}
      const player=players.find(p=>p.name.toLocaleLowerCase()===query);
      if(player){input.value=player.name;suggestions.hidden=true;renderPlayer(player)}
      else{message.textContent='未找到这个角色名，请从输入建议中选择。';profile.hidden=true;welcome.hidden=false}
    }

    input.addEventListener('input',showSuggestions);
    document.querySelector('#searchForm').addEventListener('submit',event=>{event.preventDefault();findPlayer(input.value)});
    document.addEventListener('click',event=>{if(!event.target.closest('.field'))suggestions.hidden=true});

    players=window.COORDINATE_DATA||[];
    document.querySelector('#recordCount').textContent=players.length?`${players.length} 位角色 · 12 类资源`:'名册读取失败';
    if(!players.length)message.textContent='坐标名册读取失败，请重新打开页面。';
  </script>
